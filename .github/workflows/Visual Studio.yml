name: Visual Studio (.sln)
on:
  push:
    branches:
      - '**' # only run on branches
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Checkout Examples
      uses: actions/checkout@v7
      with:
        repository: 32blit/32blit-examples
        path: examples

    - name: Install deps
      shell: bash
      run: |
        ci/install_sdl_vs.sh
        # 32blit tools 0.7.4 import ConstBitStream, which bitstring 5 removed
        python -m pip install 32blit "bitstring<5"

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild.exe vs/32blit.sln
