name: Desktop development smoke

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-debug:
    name: Linux Debug / installed authoring tools
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install SDL and asset tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-net-dev
        python3 -m venv .venv
        .venv/bin/python -m pip install '32blit==0.7.4' 'bitstring<5' ./tools/blit-tools
    - name: Smoke installed authoring tools
      run: |
        .venv/bin/python -I -c 'import blit_tools, blit_tiled, blit_tiled_project'
        smoke_dir=$(mktemp -d)
        printf '%s\n' '{"version":1,"tile_flags":{"solid":0}}' > "$smoke_dir/schema.json"
        .venv/bin/blit tile-flags "$smoke_dir/schema.json" "$smoke_dir/tile_flags.hpp"
        grep -F 'is_solid = 0x00000001u,' "$smoke_dir/tile_flags.hpp"
    - name: Verify generated scene staging
      env:
        CMAKE_GENERATOR: Unix Makefiles
      run: .venv/bin/python tools/blit-tools/tests/test_tiled_staging.py
    # The release matrix doesn't build the Debug-only dev bridge. Link a desktop
    # executable against it without fetching any examples or needing a display.
    - name: Configure SDK Debug build
      run: >-
        cmake -S . -B build.desktop-smoke
        -DCMAKE_BUILD_TYPE=Debug -DBLIT_DEV_BRIDGE=ON
        -DPython_EXECUTABLE="$PWD/.venv/bin/python"
    - name: Build and link the SDL launcher
      run: cmake --build build.desktop-smoke --target launcher --parallel 2
